[package]
name = "venom_memory"
version = "0.1.0"
edition = "2021"
authors = ["VenomMemory Contributors"]
description = "High-performance lock-free shared memory IPC library"
license = "MIT"
readme = "README.md"

[dependencies]
rustix = { version = "0.38", features = ["mm", "shm", "fs"] }
thiserror = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[example]]
name = "daemon"
path = "examples/daemon.rs"

[[example]]
name = "shell"
path = "examples/shell.rs"

[[example]]
name = "multicore_test"
path = "examples/multicore_test.rs"

[[example]]
name = "ultra_test"
path = "examples/ultra_test.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
